<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  :root {
    --bg: #0A1312; --bg2: #0E1918; --glass: rgba(255,255,255,0.032);
    --border: rgba(255,255,255,0.05); --mint: #4ADE80; --mint-d: #1A6B3A;
    --gold: #F5C842; --gold-d: #B8941F; --teal: #2DD4BF; --purple: #A78BFA;
    --rose: #FB7185; --orange: #FB923C; --sky: #7DD3FC;
    --text: #EDE8DF; --mid: #8A9490; --dim: #4A5553;
    --spr: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:'Nunito',system-ui,sans-serif;
    display:flex; justify-content:center; min-height:100vh; overflow:hidden; }
  #app { width:100%; max-width:430px; height:100vh; display:flex; flex-direction:column;
    position:relative; overflow:hidden; }
  .scroll { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; }
  .scroll::-webkit-scrollbar { display:none; }
  .ar { font-family:'Amiri',serif; direction:rtl; text-align:right; }

  /* Glass card */
  .card { background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-radius:20px; padding:15px; border:1px solid var(--border);
    position:relative; overflow:hidden; transition:all 0.2s ease; }
  .card.tap { cursor:pointer; }
  .card.tap:active { transform:scale(0.98); }

  /* Geo pattern */
  .geo { position:absolute; inset:0; pointer-events:none; opacity:0.03; }

  /* Animations */
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
  @keyframes popIn { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }
  @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
  @keyframes confetti { 0%{transform:translateY(0)rotate(0);opacity:1} 100%{transform:translateY(-140px)rotate(720deg)scale(0);opacity:0} }
  @keyframes sway { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
  @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
  @keyframes countdownPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  @keyframes glow { 0%,100%{filter:drop-shadow(0 0 6px var(--gold))} 50%{filter:drop-shadow(0 0 14px var(--gold))} }
  .anim-fi { animation: fadeIn 0.4s ease both; }
  .anim-su { animation: slideUp 0.35s ease both; }
  .anim-pop { animation: popIn 0.4s var(--spr) both; }

  /* Bottom nav */
  .nav { height:74px; display:flex; align-items:flex-start; justify-content:space-around;
    background:rgba(10,19,18,0.97); backdrop-filter:blur(18px);
    border-top:1px solid var(--border); padding-top:8px; flex-shrink:0; }
  .nav-btn { background:none; border:none; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; gap:2px; transition:all 0.25s var(--spr); color:var(--dim); }
  .nav-btn.active { color:var(--mint); transform:scale(1.1); }
  .nav-icon { width:42px; height:42px; border-radius:14px; display:flex; align-items:center;
    justify-content:center; font-size:19px; transition:all 0.2s ease; }
  .nav-btn.active .nav-icon { background:rgba(74,222,128,0.12); }
  .nav-lbl { font-size:9px; font-weight:700; }

  /* Loot overlay */
  .loot-overlay { position:fixed; inset:0; z-index:9999; display:flex; align-items:center;
    justify-content:center; background:rgba(0,0,0,0.93); backdrop-filter:blur(24px);
    animation:fadeIn 0.3s ease; cursor:pointer; }
  .loot-particle { position:absolute; border-radius:50%;
    animation:confetti 1.5s var(--spr) forwards; opacity:0; }
  .loot-content { text-align:center; z-index:2; padding:28px; max-width:320px;
    animation:popIn 0.5s ease 100ms both; }

  /* Progress ring SVG */
  .ring-track { fill:none; stroke:rgba(255,255,255,0.03); }
  .ring-fill { fill:none; stroke-linecap:round; transition:stroke-dashoffset 0.8s var(--spr); }

  /* Onboarding */
  .ob-btn { width:100%; display:flex; align-items:center; gap:14px; padding:16px;
    border-radius:20px; background:var(--glass); border:1px solid var(--border);
    cursor:pointer; text-align:left; transition:all 0.2s ease; color:var(--text); }
  .ob-btn:hover { border-color:rgba(255,255,255,0.1); transform:translateY(-2px); }
  .ob-icon { font-size:28px; width:48px; height:48px; border-radius:16px;
    background:rgba(74,222,128,0.06); display:flex; align-items:center;
    justify-content:center; flex-shrink:0; }

  /* Bars */
  .bar-col { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; }
  .bar { border-radius:6px; width:100%; transition:height 0.6s var(--spr); min-height:4px; }

  /* Prayer widget */
  .prayer-pill { flex:1; text-align:center; padding:6px 2px; border-radius:10px;
    border:1px solid transparent; transition:all 0.2s ease; }
  .prayer-pill.next { background:rgba(45,212,191,0.08); border-color:rgba(45,212,191,0.1); }
  .prayer-pill.done { background:rgba(74,222,128,0.1); border-color:rgba(74,222,128,0.12); }

  /* Food cards */
  .food-arrow { width:38px; height:38px; border-radius:19px; background:var(--glass);
    border:1px solid var(--border); cursor:pointer; font-size:14px; color:var(--text);
    display:flex; align-items:center; justify-content:center; transition:all 0.2s ease; }
  .food-arrow:hover { background:rgba(255,255,255,0.05); }
  .food-dot { height:4px; border-radius:2px; transition:all 0.3s var(--spr); }

  /* Check buttons */
  .check-btn { width:38px; height:38px; border-radius:19px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    cursor:pointer; transition:all 0.25s var(--spr); border:none; }

  /* Input */
  .ob-input { width:100%; padding:16px 18px; border-radius:18px; background:var(--glass);
    border:1px solid var(--border); color:var(--text); font-size:16px; font-weight:700;
    font-family:inherit; outline:none; }
  .ob-input:focus { border-color:rgba(74,222,128,0.2); }
  .ob-input::placeholder { color:var(--dim); }

  /* CTA */
  .cta { width:100%; padding:16px; border-radius:18px; border:none; font-size:15px;
    font-weight:900; font-family:inherit; cursor:pointer; transition:all 0.2s ease; }
  .cta:hover { transform:translateY(-1px); }
  .cta-mint { background:var(--mint); color:#0A1312; }
  .cta-grad { background:linear-gradient(135deg,var(--mint),var(--teal)); color:#0A1312; }

  /* Quest card */
  .quest { border-left:3px solid transparent; border-radius:4px 20px 20px 4px; }
  .quest.done { opacity:0.3; border-left:none; border-radius:20px; }

  /* Garden grid */
  .garden-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .garden-cell { aspect-ratio:1; border-radius:18px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; border:1px dashed rgba(255,255,255,0.04); }
  .garden-cell.empty { border-color:rgba(255,255,255,0.02); }
  .plant-grown { animation:sway 3s ease infinite; }

  /* Ayah grid */
  .ayah-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
  .ayah-card { border-radius:14px; padding:8px; border:1px solid rgba(255,255,255,0.02); }

  /* Insights */
  .insight-row { display:flex; align-items:center; gap:10px; }

  /* Kids mode adjustments */
  .kids .nav-icon { width:46px; height:46px; font-size:21px; }
  .kids .quest .q-icon { width:50px; height:50px; font-size:26px; }
  .kids .ob-icon { font-size:32px; width:52px; height:52px; }

  /* Scrollbar for demo */
  @media (min-width:431px) {
    body { background:#050A09; }
    #app { border-left:1px solid rgba(255,255,255,0.03); border-right:1px solid rgba(255,255,255,0.03); }
  }
</style>

  const eqt=-7.655*Math.sin((357.528+0.9856003*n)*Math.PI/180)+9.873*Math.sin(2*((280.46+0.9856474*n)+1.914*Math.sin((357.528+0.9856003*n)*Math.PI/180))*Math.PI/180);
  const noon=12-lng/15-eqt/60;
  const ha=a=>Math.acos((Math.sin(a*Math.PI/180)-Math.sin(latR)*Math.sin(decR))/(Math.cos(latR)*Math.cos(decR)))*180/Math.PI/15;
  const fmt=h=>{const hr=Math.floor(h),mn=Math.round((h-hr)*60);return`${String(hr).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;};
  return{Fajr:fmt(noon-ha(-18)),Sunrise:fmt(noon-ha(-0.833)),Dhuhr:fmt(noon+0.02),Asr:fmt(noon+ha(45)*0.67),Maghrib:fmt(noon+ha(-0.833)),Isha:fmt(noon+ha(-17))};
}
const prayers = calcPrayers();
const timeToMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const fmtCD=m=>{if(m<0)m+=1440;const h=Math.floor(m/60);return h>0?`${h}h ${m%60}m`:`${m%60}m`;};

function getNextPrayer(){
  const n=nowMin(),order=["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"];
  for(const p of order){const m=timeToMin(prayers[p]);if(m>n)return{name:p,time:prayers[p],mins:m-n};}
  return{name:"Fajr",time:prayers.Fajr,mins:timeToMin(prayers.Fajr)+1440-n};
}

function getDailyQuests(){
  const e=QUESTS.filter(q=>q.df==='easy'),m=QUESTS.filter(q=>q.df==='medium'),h=QUESTS.filter(q=>q.df==='hard');
  return[e[seed%e.length],m[(seed*7)%m.length],h[(seed*13)%h.length]];
}
function getBonus(){return QUESTS.filter(q=>q.cat==='well')[seed%QUESTS.filter(q=>q.cat==='well').length];}
function getStation(xp){let s=JOURNEY[0];for(const j of JOURNEY)if(xp>=j.xp)s=j;return s;}
function getNextStation(xp){const s=getStation(xp);const i=JOURNEY.indexOf(s);return i<JOURNEY.length-1?JOURNEY[i+1]:null;}

const geoSVG = `<svg class="geo" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice"><defs><pattern id="gp" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M20 0L40 20L20 40L0 20Z" fill="none" stroke="#F5C842" stroke-width="0.3"/><circle cx="20" cy="20" r="6" fill="none" stroke="#F5C842" stroke-width="0.2"/></pattern></defs><rect width="200" height="200" fill="url(#gp)"/></svg>`;

function ringSVG(val,sz=44,sk=3,co=C.mint){
  const r=(sz-sk)/2,ci=2*Math.PI*r,off=ci-Math.min(val/100,1)*ci;
  return`<svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" class="ring-track" stroke-width="${sk}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" class="ring-fill" stroke="${co}" stroke-width="${sk}" stroke-dasharray="${ci}" stroke-dashoffset="${off}" style="filter:drop-shadow(0 0 5px ${co}30)"/></svg>`;
}

  if(S.phase==='onboard'){ renderOnboarding(app,k); return; }

  const quests = getDailyQuests();
  const bonus = getBonus();
  const np = getNextPrayer();
  const st = getStation(S.xp);

  const qdc = Object.keys(S.qDone).length + (S.bonusDone?1:0);

  let content = '';
  
  if(S.screen==='home') content = renderHome(k,quests,bonus,np,st,ns,qdc,qt,sdone);

      <div style="display:inline-flex;padding:3px 9px;border-radius:10px;background:${dc}10;margin-bottom:8px"><span style="font-size:9px;font-weight:800;color:${dc}">${fd.h?'✅ BRAIN HERO':'🚫 BRAIN VILLAIN'}</span></div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span style="font-size:${k?38:32}px">${fd.em}</span><div><h3 style="font-size:${k?16:14}px;font-weight:900">${fd.n}</h3><span style="font-size:9px;color:${dc};font-weight:700">${fd.tag}</span></div></div>
      ${!S.foodFlip?`<div class="anim-fi"><div style="background:rgba(255,255,255,0.025);border-radius:14px;padding:12px;border:1px solid var(--border)"><p style="font-size:8px;font-weight:800;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">😂 THE JOKE</p><p style="font-size:${k?12:11}px;line-height:1.6;white-space:pre-line;font-weight:600">${k?fd.jk:fd.j}</p></div><p style="font-size:9px;color:var(--dim);text-align:center;margin-top:6px">Tap → science side</p></div>`:
      `<div class="anim-fi"><div style="background:${C.mint}04;border-radius:12px;padding:10px;margin-bottom:6px;border:1px solid ${C.mint}06"><p style="font-size:8px;font-weight:800;color:${C.mint};letter-spacing:1px;text-transform:uppercase;margin-bottom:2px">🔬 THE SCIENCE</p><p style="font-size:10px;color:var(--mid);line-height:1.4">${fd.sci}</p></div>
      <div style="background:${C.gold}03;border-radius:10px;padding:8px;border:1px solid ${C.gold}05"><p style="font-size:8px;font-weight:800;color:${C.gold};letter-spacing:1px;text-transform:uppercase;margin-bottom:2px">💡 ACTION</p><p style="font-size:10px;color:var(--mid)">${fd.tip}</p></div><p style="font-size:9px;color:var(--dim);text-align:center;margin-top:6px">Tap → joke side</p></div>`}
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <button class="food-arrow" onclick="event.stopPropagation();prevFood()">←</button>
      <div style="display:flex;gap:3px">${FOODS.map((_,i)=>`<div class="food-dot" style="width:${i===S.foodCard?14:4}px;background:${i===S.foodCard?(FOODS[i].h?C.mint:C.rose):'rgba(255,255,255,0.04)'}"></div>`).join('')}</div>
      <button class="food-arrow" onclick="event.stopPropagation();nextFood()">→</button>
    </div>`;
  }
  else if(S.subTab==='check'){
    h += `<div class="card" style="margin-bottom:10px;text-align:center;${cscore>=5?`background:linear-gradient(135deg,${C.gold}25,#8B691425)`:''};${cscore>=5?'border-color:'+C.gold+'20':''}">
      <div style="font-size:8px;font-weight:800;letter-spacing:1.5px;color:${cscore>=5?'rgba(255,255,255,0.7)':'var(--dim)'};text-transform:uppercase">${cscore>=5?(k?"BRAIN FUEL: MAXIMUM! 🚀":"BRAIN FUEL: OPTIMAL 🌟"):'BRAIN FUEL CHECK'}</div>
      <div style="font-size:38px;font-weight:900;color:${cscore>=5?'#fff':'var(--text)'};margin:3px 0">${cscore}/5</div>
      <div style="font-size:10px;color:${cscore>=5?'rgba(255,255,255,0.8)':'var(--mid)'};font-weight:600">${cscore===0?(k?"Let's power up! 🔋":"Running on duas and hope."):cscore<=2?(k?"Getting there! 💪":"Neurons cautiously optimistic."):cscore<=4?(k?"Almost perfect! 🤩":"One more for max power."):k?"ULTIMATE BRAIN POWER! 🧠⚡":"ما شاء الله — Premium halal fuel!"}</div>
    </div>`;
    CHECKS.forEach((it,i)=>{const ck=S.foodChecks[it.id];
      h += `<div class="anim-su" style="background:${ck?it.co+'05':'var(--glass)'};border-radius:16px;padding:${k?12:10}px;margin-bottom:6px;border:1px solid ${ck?it.co+'10':'var(--border)'};display:flex;align-items:center;gap:10px;animation-delay:${i*40}ms">
        <button class="check-btn" onclick="toggleCheck('${it.id}')" style="background:${ck?it.co:'rgba(255,255,255,0.02)'};${ck?'':'border:2px solid rgba(255,255,255,0.05);'};color:${ck?'#fff':'var(--text)'};">${ck?'✓':it.ic}</button>
        <div style="flex:1"><p style="font-size:${k?12:11}px;font-weight:800;margin-bottom:1px">${k?it.qk:it.q}</p><p style="font-size:9px;color:${ck?it.co:'var(--dim)'};font-weight:600">${ck?(k?it.yk:it.y):(k?it.nk:it.n)}</p></div>
      </div>`;
    });
  }
  h += '<div style="height:16px"></div></div>';
  return h;
}

// ── GARDEN ──
function renderGarden(k){
  const types=Object.keys(PLANTS);
  let h = `<div style="padding:0 16px">
    <h2 style="font-size:${k?20:22}px;font-weight:900;padding:14px 0 8px">${k?"My Garden! 🌿":"Your Garden"}</h2>
    <div style="position:relative;border-radius:24px;overflow:hidden;margin-bottom:12px;background:linear-gradient(180deg,#0A1820,#0E241E 40%,#132E1A);border:1px solid var(--border);padding:${k?'24px 12px 16px':'20px 12px 14px'}">
      ${geoSVG.replace('#F5C842',C.mint).replace('0.03','0.02')}
      <div style="position:absolute;top:8px;right:16px;font-size:16px;opacity:0.3">🌙</div>
      <div class="garden-grid" style="position:relative;z-index:1">
        ${S.garden.map((sl,i)=>{const it=sl.t?PLANTS[sl.t]:null;const em=it?it.s[Math.min(sl.g,3)]:null;
          return`<div class="garden-cell ${em?'':'empty'}" style="animation:fadeIn 0.3s ease ${i*40}ms both;${em?'background:rgba(255,255,255,0.02)':''}">
            ${em?`<span style="font-size:${k?36:30}px;filter:drop-shadow(0 3px 6px rgba(0,0,0,0.3));${sl.g>=3?'animation:sway 3s ease infinite':''}">${em}</span><span style="font-size:${k?8:6}px;color:var(--dim);font-weight:700;margin-top:2px">${it.n}</span>`:
            '<span style="font-size:18px;opacity:0.1">·</span>'}
          </div>`;}).join('')}
      </div>
    </div>
    <p style="font-size:${k?11:10}px;color:var(--dim);margin-bottom:14px;line-height:1.4;padding:0 4px">${k?"Every quest grows a plant! 🌱→🌿→🌷→🌳 Garden NEVER dies — waits for you! 💚":"Quests water your garden. 4 growth stages. Never dies — just waits."}</p>`;

  // Ayah collection
  h += `<h3 style="font-size:${k?14:13}px;font-weight:800;margin:0 0 6px">📿 Ayah Collection (${S.col.length}/${QURAN.length})</h3>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:12px;background:var(--glass);border-radius:16px;border:1px solid var(--border)">
      <div style="position:relative;width:42px;height:42px">${ringSVG((S.col.length/QURAN.length)*100,42,3,C.purple)}<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:${C.purple}">${S.col.length}</div></div>
      <div><div style="font-size:11px;font-weight:800">${S.col.length}/${QURAN.length} ${k?'found!':'discovered'}</div>
        <p style="font-size:9px;color:var(--dim);margin-top:2px">${k?'Complete quests to find rare verses!':'Complete quests for random drops.'}</p>
      </div>
    </div>
    <div class="ayah-grid">
      ${QURAN.map((a,i)=>{const own=S.col.includes(a.id);const rc=RC[a.r];
        return`<div class="ayah-card anim-su" style="animation-delay:${i*25}ms;${own?`background:${rc}04;border-color:${rc}10`:'background:rgba(255,255,255,0.01)'}">
          ${own?`<span style="font-size:6px;font-weight:800;color:${rc};text-transform:uppercase">${a.r}</span>
            <p class="ar" style="font-size:${k?12:10}px;color:${rc}a0;line-height:1.7;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${a.ar}</p>
            <p style="font-size:6px;color:${rc};font-weight:700">${a.s}</p>`:
          `<div style="text-align:center;padding:8px 0"><div style="font-size:${k?18:14}px;opacity:0.1">🔒</div><p style="font-size:6px;color:var(--dim);margin-top:2px">${a.s}</p></div>`}
        </div>`;}).join('')}
    </div>
    <div style="height:16px"></div></div>`;
  return h;
}

// ── INSIGHTS ──
function renderInsights(k,st,ns){
  const wl=S.weekLog;
  const totS=wl.reduce((s,d)=>s+d.salah,0);
  const totQ=wl.reduce((s,d)=>s+d.quests,0);
  const totF=wl.reduce((s,d)=>s+d.food,0);
  const totXP=wl.reduce((s,d)=>s+d.xp,0);
  const best=wl.reduce((b,d)=>d.xp>b.xp?d:b,wl[0]);
  const maxXP=Math.max(...wl.map(d=>d.xp));

  let h = `<div style="padding:0 16px">
    <h2 style="font-size:${k?20:22}px;font-weight:900;padding:14px 0 4px">${k?"My Week! 📊":"Weekly Insights"}</h2>
    <p style="font-size:10px;color:var(--mid);margin-bottom:12px">Patterns help you understand your ADHD brain.</p>`;

  // Hero
  h += `<div class="card anim-fi" style="margin-bottom:10px;text-align:center;background:linear-gradient(135deg,rgba(183,148,31,0.08),rgba(26,107,58,0.08));border-color:rgba(245,200,66,0.08)">
    <div style="font-size:8px;font-weight:800;letter-spacing:1.5px;color:var(--mid);text-transform:uppercase">WEEKLY XP</div>
    <div style="font-size:${k?42:36}px;font-weight:900;color:${C.gold};margin:2px 0">${totXP}</div>
    <p style="font-size:10px;color:var(--mid)">${k?`Best day: ${best.day} — ON FIRE! 🔥`:`Best: ${best.day} (${best.xp} XP)`}</p>
  </div>`;

  // XP bars
  h += `<div class="card" style="margin-bottom:10px">
    <p style="font-size:9px;font-weight:800;color:var(--mid);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">📊 DAILY XP</p>
    <div style="display:flex;gap:4px;align-items:flex-end;height:${k?100:80}px">
      ${wl.map((d,i)=>{const pct=maxXP>0?(d.xp/maxXP)*100:0;const isT=i===6;
        return`<div class="bar-col"><span style="font-size:8px;font-weight:700;color:${isT?C.gold:'var(--dim)'}">${d.xp}</span>
          <div class="bar" style="height:${Math.max(pct,8)}%;background:${isT?`linear-gradient(180deg,${C.gold},${C.mint+'60'})`:d.xp>=60?C.mint+'60':C.mint+'30'};transition-delay:${i*60}ms"></div>
          <span style="font-size:${k?9:7}px;font-weight:${isT?800:600};color:${isT?C.gold:'var(--dim)'}">${d.day}</span></div>`;}).join('')}
    </div></div>`;

  // Salah
  h += `<div class="card" style="margin-bottom:10px">
    <p style="font-size:9px;font-weight:800;color:var(--mid);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">🤲 PRAYERS</p>
    <div style="display:flex;gap:4px;align-items:flex-end;height:${k?80:60}px">
      ${wl.map((d,i)=>{const pct=(d.salah/5)*100;const isT=i===6;
        return`<div class="bar-col"><span style="font-size:8px;font-weight:700;color:${d.salah>=5?C.gold:'var(--dim)'}">${d.salah}/5</span>
          <div class="bar" style="height:${Math.max(pct,8)}%;background:${d.salah>=5?C.gold+'60':d.salah>=3?C.teal+'50':C.teal+'25'};transition-delay:${i*60}ms"></div>
          <span style="font-size:${k?9:7}px;font-weight:${isT?800:600};color:${isT?C.teal:'var(--dim)'}">${d.day}</span></div>`;}).join('')}
    </div>
    <div style="margin-top:8px;padding:8px 10px;border-radius:12px;background:${C.teal}05;border:1px solid ${C.teal}06">
      <p style="font-size:10px;color:${C.teal};font-weight:700">💡 ${totS>=30?(k?"WOW! Almost every prayer! 🌟":"Nearly every prayer. ما شاء الله"):totS>=20?(k?"Great job — keep building! 💪":`${totS}/35 — building momentum.`):(k?`${totS} prayers — every one counts! 🤲`:`${totS}/35 — small progress is progress.`)}</p>
    </div></div>`;

  // Food heatmap
  h += `<div class="card" style="margin-bottom:10px">
    <p style="font-size:9px;font-weight:800;color:var(--mid);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">🧠 BRAIN FUEL</p>
    <div style="display:flex;gap:4px">
      ${wl.map((d,i)=>{const isT=i===6;return`<div style="flex:1;text-align:center">
        <div style="width:100%;aspect-ratio:1;border-radius:10px;background:${d.food>=4?C.mint+'15':d.food>=2?C.gold+'10':C.rose+'08'};border:1px solid ${d.food>=4?C.mint:d.food>=2?C.gold:C.rose}10;display:flex;align-items:center;justify-content:center;font-size:${k?14:12}px;font-weight:900;color:${d.food>=4?C.mint:d.food>=2?C.gold:C.rose}">${d.food}/5</div>
        <span style="font-size:${k?8:6}px;color:${isT?C.mint:'var(--dim)'};font-weight:${isT?800:600}">${d.day}</span>
      </div>`;}).join('')}
    </div></div>`;

  // Pattern cards
  h += `<h3 style="font-size:${k?13:12}px;font-weight:800;margin:4px 0 8px">${k?"🔍 What I learned":"🔍 Patterns"}</h3>`;
  [{i:"🕌",t:k?`You prayed ${totS} times! ${totS>=25?"Amazing!":"Every one counts!"}`:`${totS}/35 prayers. ${totS>=25?"Strong consistency.":"Building the habit."}`,c:C.teal},
   {i:"⚔️",t:k?`${totQ} quests done! Garden has ${S.garden.filter(s=>s.t).length} plants!`:`${totQ} quests → ${S.garden.filter(s=>s.t).length} garden plants.`,c:C.gold},
   {i:"🧠",t:k?`Brain fuel avg: ${(totF/7).toFixed(1)}/5 ${totF>=25?"— THRIVING!":"— more protein!"}`:`Nutrition: ${(totF/7).toFixed(1)}/5 avg. ${totF>=25?"Excellent.":"Protein = focus."}`,c:C.mint},
   {i:"📿",t:k?`${S.col.length} ayahs collected! ${QURAN.length-S.col.length} to go!`:`${S.col.length}/${QURAN.length} ayahs. Keep questing for rare drops.`,c:C.purple}
  ].forEach((ins,i)=>{
    h += `<div class="card anim-su" style="margin-bottom:6px;padding:10px 12px;animation-delay:${i*60}ms">
      <div class="insight-row"><span style="font-size:${k?20:16}px">${ins.i}</span><p style="font-size:${k?11:10}px;color:var(--mid);line-height:1.4;flex:1">${ins.t}</p></div></div>`;
  });

  // Journey
  h += `<div class="card" style="margin-top:6px;background:rgba(245,200,66,0.02);border-color:rgba(245,200,66,0.04)">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:${k?28:24}px">${st.l}</span>
      <div><div style="font-size:12px;font-weight:800;color:${C.gold}">${st.n}</div><div style="font-size:9px;color:var(--dim)">${S.xp} XP · ${ns?`${ns.xp-S.xp} to ${ns.n}`:'Journey complete!'}</div></div>
    </div>
    ${ns?`<div style="margin-top:8px;height:5px;border-radius:3px;background:rgba(255,255,255,0.03);overflow:hidden"><div style="height:100%;border-radius:3px;background:linear-gradient(90deg,${C.gold},${C.mint});width:${Math.min(((S.xp-st.xp)/(ns.xp-st.xp))*100,100)}%;transition:width 0.8s var(--spr)"></div></div>`:''}
  </div>
  <div style="height:16px"></div></div>`;
  return h;
}

// ── LOOT DROP ──
function showLoot(type, data){
  const overlay = document.createElement('div');
  overlay.className = 'loot-overlay';
  overlay.onclick = ()=> overlay.remove();

  let particles = '';
  const colors = [C.gold,'#fff',C.mint,C.teal,C.purple];
  for(let i=0;i<40;i++){
    const x=50+(Math.random()-0.5)*80, y=42+(Math.random()-0.5)*60;
    const sz=2+Math.random()*5, delay=Math.random()*400;
    particles += `<div class="loot-particle" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;background:${colors[i%5]};animation-delay:${delay}ms"></div>`;
  }

  let content = '';
  if(type==='ayah'){
    const rc=RC[data.r]||C.gold;
    content = `<div style="font-size:13px;font-weight:800;color:${rc};letter-spacing:2px;text-transform:uppercase;margin-bottom:10px">${data.r==='legendary'?'⭐ LEGENDARY':data.r==='epic'?'💎 EPIC':'✨ '+data.r.toUpperCase()} VERSE</div>
      <div style="background:rgba(255,255,255,0.03);border-radius:20px;padding:20px;border:1px solid ${rc}18">
        <p class="ar" style="font-size:18px;color:${rc}bb;line-height:1.9;margin-bottom:6px">${data.ar}</p>
        <p style="font-size:11px;color:var(--mid);font-style:italic">"${data.en}"</p>
        <p style="font-size:10px;color:${rc};font-weight:800;margin-top:6px">— ${data.s} ${data.v}</p>
      </div>`;
  } else {
    content = `<div style="font-size:48px;margin-bottom:8px">${data.icon||'🌟'}</div>
      <h3 style="font-size:20px;font-weight:900;color:${C.gold};margin-bottom:4px">${data.title}</h3>
      <p style="font-size:12px;color:var(--mid)">${data.desc||''}</p>
      <div style="margin-top:10px;padding:5px 14px;border-radius:12px;background:${C.mint}12;display:inline-block"><span style="font-size:13px;font-weight:900;color:${C.mint}">+${data.xp} XP</span></div>`;
  }

  overlay.innerHTML = `${particles}<div class="loot-content">${content}</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>{ if(document.body.contains(overlay)) overlay.remove(); },4500);
}

// ── ACTIONS ──
function nav(screen){ S.screen=screen; render(); scrollTop(); }
function scrollTop(){ setTimeout(()=>{const el=document.getElementById('scrollArea');if(el)el.scrollTop=0;},50); }
function setMode(m){ S.mode=m; S.obStep=1; render(); }
function setStruggle(s){ S.struggle=s; S.obStep=2; render(); }
function obNext(){ const inp=document.getElementById('nameInput'); if(inp)S.name=inp.value.trim(); S.obStep=3; render(); }
function startApp(){ S.phase='app'; S.screen='home'; render(); scrollTop(); }
function setSubTab(t){ S.subTab=t; render(); }
function flipFood(){ S.foodFlip=!S.foodFlip; render(); }
function prevFood(){ S.foodFlip=false; S.foodCard=(S.foodCard-1+FOODS.length)%FOODS.length; render(); }
function nextFood(){ S.foodFlip=false; S.foodCard=(S.foodCard+1)%FOODS.length; render(); }
function toggleCheck(id){ S.foodChecks[id]=!S.foodChecks[id]; render(); }

function cycleSalah(p){
  S.salah[p] = S.salah[p]===0?1:S.salah[p]===1?0.5:0;
  if(S.salah[p]===1) S.xp+=10;
  render();
}

function doQuest(id){
  if(S.qDone[id]) return;
  const q = QUESTS.find(x=>x.id===id); if(!q) return;
  S.qDone[id] = true;
  S.xp += q.xp;

  // Grow garden
  const gw = S.garden.filter(s=>s.t&&s.g<3);
  if(gw.length) gw[Math.floor(Math.random()*gw.length)].g++;
  else { const em=S.garden.findIndex(s=>!s.t); if(em>=0){const ty=Object.keys(PLANTS);S.garden[em]={t:ty[Math.floor(Math.random()*ty.length)],g:0};} }

  // Ayah loot
  if(Math.random()<0.3){
    const unc=QURAN.filter(a=>!S.col.includes(a.id));
    if(unc.length){
      const wt=unc.map(a=>a.r==='legendary'?1:a.r==='epic'?3:a.r==='rare'?6:10);
      const tw=wt.reduce((s,w)=>s+w,0); let r=Math.random()*tw, pk=unc[0];
      for(let i=0;i<unc.length;i++){r-=wt[i];if(r<=0){pk=unc[i];break;}}
      S.col.push(pk.id);
      render();
      setTimeout(()=>showLoot('ayah',pk),400);
      return;
    }
  }
  render();
  setTimeout(()=>showLoot('xp',{icon:q.i,title:S.mode==='kid'?'Quest Done! 🎉':'Quest Complete!',desc:q.t,xp:q.xp}),300);
}

function doBonus(){
  if(S.bonusDone) return;
  const b = getBonus();
  S.bonusDone = true;
  S.xp += b.xp;
  render();
  setTimeout(()=>showLoot('xp',{icon:'🎁',title:'Bonus!',desc:b.t,xp:b.xp}),300);
}

// ── INIT ──
render();
setInterval(()=>{ if(S.phase==='app' && S.screen==='home') render(); },30000);
</script>
